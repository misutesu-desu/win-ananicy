name: Feature request
description: Propose a focused, reversible improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should WinAnanicy solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-visible behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Reversibility and safety
      description: How should the original process or system state be restored?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This does not require telemetry or an always-online service.
          required: true
        - label: This can run without a privileged Windows service.
          required: true
